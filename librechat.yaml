version: 1.1.5
cache: true

endpoints:
  custom:
    - name: "Google Gemini"
      apiKey: "${GOOGLE_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai"
      models:
        default: [
          "gemini-3.1-pro-preview", 
          "gemini-3.7-flash"
        ]
        fetch: false
      titleConvo: true
      titleModel: "gemini-3.7-flash"
      modelDisplayLabel: "Gemini Research Vault"

# Global research temperature
default_temp: 0.35
